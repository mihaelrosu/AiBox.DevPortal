services:
  aibox-devportal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibox-devportal
    ports:
      - "14000:14000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./Data:/app/Data

      # Local Coder workspace
      # Read-only is safer. Use without :ro when you want patch/write support.
      - .:/home/mihael/projects/AiBox.DevPortal

      # ComfyUI mounts
      - /home/mihael/comfyui/workflows:/app/comfyui/user/default/workflows
      - /home/mihael/comfyui/output:/app/comfyui/output
      - /home/mihael/comfyui/input:/app/comfyui/input
      - /home/mihael/comfyui/models/checkpoints:/app/comfyui/models/checkpoints
      - /home/mihael/comfyui/models/loras:/app/comfyui/models/loras
      - /home/mihael/comfyui/models/upscale_models:/app/comfyui/models/upscale_models
      - /home/mihael/comfyui/models/controlnet:/app/comfyui/models/controlnet
      - /home/mihael/comfyui/models/unet:/app/comfyui/models/unet
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 14000
      GIT_CONFIG_GLOBAL: /app/Data/.gitconfig

      AiBox__Environment: Development

      # ComfyUI
      AiBox__ComfyUrl: http://host.docker.internal:8188
      AiBox__ComfyUI__BaseUrl: http://host.docker.internal:8188
      AiBox__ComfyUI__WorkflowFolder: /app/comfyui/user/default/workflows
      AiBox__ComfyUI__OutputFolder: /app/comfyui/output
      AiBox__ComfyUI__InputFolder: /app/comfyui/input

      # Ollama
      AiBox__OllamaUrl: http://host.docker.internal:11434
      AiBox__PromptEnhancerModel: qwen2.5-coder:7b

      # Local Coder
      AiBox__LocalCoder__WorkspaceRoots__0: /home/mihael/projects/AiBox.DevPortal
      DevPortal__ProjectsRoot: /home/mihael/projects/AiBox.DevPortal
      AiBox__LocalCoder__DefaultModel: qwen2.5-coder:7b
      AiBox__LocalCoder__AllowedCommands__0: git status
      AiBox__LocalCoder__AllowedCommands__1: git diff
      AiBox__LocalCoder__AllowedCommands__2: dotnet build
      AiBox__LocalCoder__AllowedCommands__3: dotnet test
      AiBox__LocalCoder__AllowedCommands__4: ls
      AiBox__LocalCoder__AllowedCommands__5: pwd
    restart: unless-stopped
